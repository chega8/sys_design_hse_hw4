name: fraud-hw4
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42
    environment:
      CLICKHOUSE_DB: homework
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: student
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user student --password student --query 'EXISTS TABLE homework.transactions' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  clickhouse-data:
